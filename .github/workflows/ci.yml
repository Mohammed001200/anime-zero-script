name: Luau checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned tools
        run: |
          mkdir -p .tools build
          curl -fsSL https://github.com/lune-org/lune/releases/download/v0.11.0/lune-0.11.0-linux-x86_64.zip -o /tmp/lune.zip
          curl -fsSL https://github.com/JohnnyMorganz/StyLua/releases/download/v2.6.0/stylua-linux-x86_64.zip -o /tmp/stylua.zip
          curl -fsSL https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/rojo.zip
          unzip -o /tmp/lune.zip -d .tools
          unzip -o /tmp/stylua.zip -d .tools
          unzip -o /tmp/rojo.zip -d .tools
          chmod +x .tools/lune .tools/stylua .tools/rojo
      - name: Compile, test, format and build
        run: |
          python3 scripts/bundle.py --check
          python3 -m unittest discover -s tests -p '*_test.py' -v
          .tools/lune run scripts/check.luau
          .tools/lune run tests/run.luau
          .tools/stylua --check src demo tests scripts main.client.lua
          .tools/rojo build default.project.json --output build/MohammadAndAli-Demo.rbxlx
          .tools/rojo build production.project.json --output build/MohammadAndAli-Integration.rbxlx
          .tools/rojo build standalone.project.json --output build/MohammadAndAli-Standalone.rbxlx
          git diff --check
